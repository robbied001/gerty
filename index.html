<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerty – Home Automation</title>
  <style>
    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --text:      #e4e4e7;
      --text-dim:  #71717a;
      --accent:    #3b82f6;
      --green:     #22c55e;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --radius:    12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      padding: 24px 32px 16px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ── Dashboard grid ───────────────────────────────── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 16px 32px 32px;
      flex: 1;
    }

    /* ── Card (shared widget base) ────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .card-icon svg { width: 22px; height: 22px; }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }
    .card-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* ── Pool pump toggle ─────────────────────────────── */
    .pump-icon { background: rgba(59,130,246,0.15); color: var(--accent); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 0.95rem;
      color: var(--text-dim);
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      cursor: pointer;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 28px;
      transition: background 0.25s;
    }
    .slider::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 22px;
      height: 22px;
      background: var(--text);
      border-radius: 50%;
      transition: transform 0.25s;
    }
    .switch input:checked + .slider { background: var(--green); }
    .switch input:checked + .slider::after { transform: translateX(24px); }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-on  { background: rgba(34,197,94,0.15); color: var(--green); }
    .status-off { background: rgba(113,113,122,0.15); color: var(--text-dim); }

    /* ── Solar battery ────────────────────────────────── */
    .solar-icon { background: rgba(245,158,11,0.15); color: var(--amber); }

    .battery-bar-track {
      width: 100%;
      height: 14px;
      background: var(--border);
      border-radius: 7px;
      overflow: hidden;
    }
    .battery-bar-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.6s ease, background 0.6s ease;
    }
    .battery-details {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 480px) {
      header { padding: 16px; }
      .dashboard { padding: 8px 16px 16px; gap: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Gerty</h1>
    <p id="clock"></p>
  </header>

  <main class="dashboard">

    <!-- ── Pool Pump ────────────────────────────────── -->
    <div class="card" id="pool-pump-card">
      <div class="card-header">
        <div class="card-icon pump-icon">
          <!-- water-drop SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C12 2 5 10 5 14a7 7 0 0 0 14 0c0-4-7-12-7-12Z"/>
          </svg>
        </div>
        <div>
          <div class="card-title">Pool Pump</div>
          <span class="status-badge status-off" id="pump-badge">OFF</span>
        </div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Power</span>
        <label class="switch">
          <input type="checkbox" id="pump-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- ── Solar Battery ────────────────────────────── -->
    <div class="card" id="solar-card">
      <div class="card-header">
        <div class="card-icon solar-icon">
          <!-- sun SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </div>
        <div>
          <div class="card-title">Solar Battery</div>
          <div class="card-value" id="battery-pct">--%</div>
        </div>
      </div>
      <div class="battery-bar-track">
        <div class="battery-bar-fill" id="battery-bar" style="width:0%"></div>
      </div>
      <div class="battery-details">
        <span id="battery-status">Reading...</span>
        <span id="battery-pct-small"></span>
      </div>
    </div>

  </main>

  <script src="devices.js"></script>
  <script src="app.js"></script>
</body>
</html>
